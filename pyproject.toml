[project]
name = "ai-book-writer"
version = "0.1.0"
description = "Multi-agent AI system that writes a full book, with an MCP server exposing each agent as a tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "rich>=13.7",
]

[project.scripts]
book-writer = "book_writer.cli:main"
book-writer-mcp = "book_writer.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["book_writer*"]
